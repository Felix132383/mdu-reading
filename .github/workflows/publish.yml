name: 自动上架
on:
  push:
    paths: ["books/**"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: auto-publish
  cancel-in-progress: false
jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install --quiet python-docx lxml
      - run: python tools/build_data.py
      - name: 提交结果
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "无改动"; exit 0; fi
          git commit -m "自动上架：$(git diff --cached --name-only --diff-filter=A -- 'books/*' | head -3 | tr '\n' ' ')"
          git push
